# nginx.conf — SMS Taxi dashboard, production deployment.
#
# Serves the built Angular SPA (dist output) and reverse-proxies ALL API
# traffic server-side, so the browser only ever talks to this origin
# (http://41.225.11.231:5005 via docker-compose's "5005:80" mapping) — no CORS.
#
# Location-block mapping table (approved 2026-09-25, see docs/DEPLOYMENT.md):
#   /                         -> SPA static  (try_files -> /index.html)
#   /api/                     -> 41.225.11.231:8577   (main API; pass-through)
#   /taxi-client/api/ratings  -> 41.225.11.231:8577   (main API — NOT 8444!)
#   /taxi-client/api/notifications -> 41.225.11.231:8444 (notifications backend; pass-through)
#   /taxi-client/api/get-all-taxis-criteria   -> 8444
#   /taxi-client/api/get-all-clients-criteria -> 8444
#   /taxi-client/api/ (fallback) -> 404 (never index.html)
#   /chat-api/                -> 41.225.11.231:5000  (whatsapp REST; rewrite ^/chat-api -> /api, preserve remainder)
#   /chat-ws                  -> 41.225.11.231:5000  (SockJS WS;  rewrite ^/chat-ws -> /ws-chat, preserve remainder)
#
# Nginx longest-prefix matching resolves the shared `/taxi-client/api/`
# prefix: `ratings` -> 8577, `notifications` + criteria -> 8444.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # ---- 1. SPA static ----
    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # SPA fallback: any unmatched path serves index.html so client-side
        # routes (e.g. /dashboard, /chats) work on refresh/bookmark.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Explicitly avoid caching index.html (it references hashed bundles).
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---- 2. Main API: all /api/* endpoints -> 8577 (Decision 1) ----
        # Pass-through: full original URI forwarded unchanged (proxy_pass
        # without URI tail keeps the request path).
        location /api/ {
            proxy_pass         http://41.225.11.231:8577;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---- 3. Driver/rating endpoints live on the MAIN API (8577), ----
        # ----    NOT on the notifications host. Longest prefix must win. ----
        location /taxi-client/api/ratings {
            proxy_pass         http://41.225.11.231:8577;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---- 4. Notifications backend: /taxi-client/api/notifications* -> 8444 ----
        # Full pass-through, NOT rewritten (NotificationService builds
        # `${notificationsBaseUrl}/api/...` = /taxi-client/api/... ; upstream
        # serves under the /taxi-client base path).
        location /taxi-client/api/notifications {
            proxy_pass         http://41.225.11.231:8444;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---- 5. Criteria endpoints on the notifications backend (8444) ----
        location = /taxi-client/api/get-all-taxis-criteria {
            proxy_pass         http://41.225.11.231:8444;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /taxi-client/api/get-all-clients-criteria {
            proxy_pass         http://41.225.11.231:8444;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---- 6. Fallback for ANY other /taxi-client/api/* path: 404 ----
        # Never serve index.html for unknown API paths (would mask API errors
        # as an SPA HTML response). Add a new explicit location above if a
        # backend gains a new /taxi-client/api/ endpoint.
        location /taxi-client/api/ {
            return 404;
        }

        # ---- 7. WhatsApp chat REST: /chat-api/* -> 41.225.11.231:5000 ----
        # Mirrors dev proxy.conf.js: the reference host serves the whatsapp
        # REST under `/api/chat`, so strip the visible `/chat-api` prefix.
        # Environment whatsappApiUrl = '/chat-api' (same-origin relative).
        # Host header is pinned to the upstream (like dev's changeOrigin:true)
        # — the reference host 301-redirects on unknown Host values.
        location /chat-api/ {
            rewrite ^/chat-api(/.*)$ /api$1  break;
            proxy_pass         http://41.225.11.231:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host $proxy_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ---- 8. WhatsApp chat WebSocket (SockJS/STOMP): /chat-ws -> :5000 ----
        # SockJS hits /chat-ws/info (HTTP) + /chat-ws/{server}/{session}/
        # websocket (WS). Mirror dev proxy.conf.js rewrite /chat-ws -> /ws-chat.
        # Upgrade/Connection headers are REQUIRED for the WS handshake.
        location /chat-ws {
            rewrite ^/chat-ws(/.*)$ /ws-chat$1  break;
            proxy_pass         http://41.225.11.231:5000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $proxy_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- Static asset caching (hashed bundles are immutable) ----
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}