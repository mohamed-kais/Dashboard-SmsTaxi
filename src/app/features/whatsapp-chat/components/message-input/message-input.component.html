<div class="wa-input-bar">
  <textarea
    class="form-control wa-input-bar__textarea"
    rows="1"
    [placeholder]="'whatsapp.input.typeMessage' | translate"
    [(ngModel)]="content"
    [disabled]="disabled"
    (keydown)="onKeyDown($event)">
  </textarea>
  <button
    type="button"
    class="btn btn-primary wa-input-bar__send"
    [disabled]="disabled || !content.trim()"
    (click)="onSubmit()"
    [title]="'whatsapp.input.send' | translate">
    @if (!sending) {
      <i class="bx bx-send"></i>
    }
    @if (sending) {
      <span class="spinner-border spinner-border-sm" role="status"></span>
    }
  </button>
</div>
